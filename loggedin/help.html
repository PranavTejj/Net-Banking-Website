<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>333Bank - Help</title>
    <script src="angular.min.js"></script>
    <script>
        let app = angular.module("helpApp", []);
        app.controller("helpCtrl", function($scope) {
            $scope.faqs = [
                { q: "How do I transfer funds?",          a: "Go to the Transfer page, fill in the beneficiary details and amount, then click Transfer Now.",         open: false },
                { q: "How do I check my loan details?",   a: "Visit the Loans page to see your active loans, repayment progress, and use the interest calculator.",   open: false },
                { q: "Is my data secure?",                a: "Yes. All transactions are encrypted and your personal data is never shared with third parties.",         open: false },
                { q: "How do I update my profile?",       a: "Account settings will be available after the backend is connected. Coming soon!",                        open: false },
                { q: "What is an IFSC code?",             a: "IFSC (Indian Financial System Code) is an 11-character code used to identify a specific bank branch.",   open: false }
            ];
            $scope.toggle = function(faq) {
                faq.open = !faq.open;
            };
            $scope.notifications = [
                "Your EMI of ₹5,000 is due on 25th March.",
                "₹8,200 salary credited to your account.",
                "Transfer of ₹2,300 was successful."
            ];
            $scope.sendMessage = function() {
                if ($scope.contactForm.$valid) {
                    alert("Message sent! We will get back to you within 24 hours.");
                    $scope.cname = "";
                    $scope.cemail = "";
                    $scope.cmessage = "";
                    $scope.contactForm.$setPristine();
                    $scope.contactForm.$setUntouched();
                }
            };
        });
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        .help-layout { display: flex; gap: 28px; }
        .faq-section { flex: 1; }
        .contact-section { flex: 0 0 360px; }
        .faq-item { margin-bottom: 10px; }
        .faq-question {
            width: 100%; text-align: left; padding: 14px 16px;
            background: #111d2e; border: 1px solid #1e2d42;
            border-radius: 6px; color: #ffffff; font-size: 14px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .faq-question:hover { border-color: #4a90d9; }
        .faq-answer {
            padding: 12px 16px; background: #0f1724;
            border: 1px solid #1e2d42; border-top: none;
            border-radius: 0 0 6px 6px; font-size: 13px;
            color: #aab4c0; line-height: 1.7;
        }
        .contact-section textarea {
            width: 100%; padding: 9px 12px;
            background: #0f1724; border: 1px solid #1e2d42;
            border-radius: 6px; color: #ffffff; font-size: 14px;
            margin-bottom: 6px; resize: vertical; min-height: 90px;
            font-family: Arial, sans-serif;
        }
        .contact-section textarea:focus { outline: none; border-color: #4a90d9; }
        .contact-section input {
            width: 100%; padding: 9px 12px;
            background: #0f1724; border: 1px solid #1e2d42;
            border-radius: 6px; color: #ffffff; font-size: 14px; margin-bottom: 6px;
        }
        .contact-section input:focus { outline: none; border-color: #4a90d9; }
        .contact-section label { font-size: 13px; color: #aab4c0; display: block; margin-bottom: 4px; }
        .contact-section .form-group { margin-bottom: 14px; }
    </style>
</head>
<body ng-app="helpApp" ng-controller="helpCtrl">
<nav>
    <div class="logo">333<span>Bank</span></div>
    <div class="nav-links">
        <a href="img.html">Founders</a>
    </div>
    <div class="nav-btns">
        <button class="btn-outline" onclick="location.href='/index.html'">Log out</button>
    </div>
</nav>
<div class="page-layout">
    <div class="sidebar">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="account.html">🏦 Account</a>
        <a href="transfer.html">💸 Transfer</a>
        <a href="loans.html">📋 Loans</a>
        <a href="help.html" class="active">❓ Help</a>
        <div class="notif-box">
            <h4>🔔 Notifications</h4>
            <div class="notif-item" ng-repeat="n in notifications">{{ n }}</div>
        </div>
    </div>
    <div class="page-content">
        <div class="section-title">Help & Support</div>
        <div class="help-layout">
            <div class="faq-section">
                <p class="muted" style="margin-bottom:18px;">Frequently Asked Questions</p>
                <div class="faq-item" ng-repeat="faq in faqs">
                    <button class="faq-question" ng-click="toggle(faq)">
                        {{ faq.q }}
                        <span>{{ faq.open ? '▲' : '▼' }}</span>
                    </button>
                    <div class="faq-answer" ng-show="faq.open">
                        {{ faq.a }}
                    </div>
                </div>
            </div>
            <div class="card contact-section">
                <div class="section-title" style="font-size:16px; margin-bottom:18px;">Contact Us</div>
                <form name="contactForm">

                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" name="cname" ng-model="cname" required>
                        <span class="error" ng-show="contactForm.cname.$touched && contactForm.cname.$error.required">
                            Name is required!
                        </span>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="cemail" ng-model="cemail" required>
                        <span class="error" ng-show="contactForm.cemail.$touched && contactForm.cemail.$error.required">
                            Email is required!
                        </span>
                        <span class="error" ng-show="contactForm.cemail.$touched && contactForm.cemail.$error.email">
                            Enter a valid email!
                        </span>
                    </div>

                    <div class="form-group">
                        <label>Message</label>
                        <textarea name="cmessage" ng-model="cmessage" required placeholder="Describe your issue..."></textarea>
                        <span class="error" ng-show="contactForm.cmessage.$touched && contactForm.cmessage.$error.required">
                            Message is required!
                        </span>
                    </div>

                    <button type="button" class="btn-fill" ng-click="sendMessage()" style="width:100%; padding:10px;">
                        Send Message
                    </button>

                </form>
            </div>

        </div>
    </div>

</div>
</body>
</html>
