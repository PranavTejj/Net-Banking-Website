<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>333Bank - Login</title>
    <script src="angular.min.js"></script>
    <script>
        let app = angular.module("loginApp", []);
        app.controller("loginCtrl", function($scope, $http) {
        $scope.loginUser = function () {
                if ($scope.loginForm.$valid) {
                    let loginData = {
                        email: $scope.email,
                        password: $scope.password
                    };
                    $http.post("http://localhost:3000/login", loginData)
                        .then(function (response) {
                            localStorage.setItem("userEmail", $scope.email);
                            alert("Login Successful");
                            window.location.href = "loggedin/dashboard.html";
                        })
                        .catch(function (err) {
                            alert("Invalid Login");
                        });
                }
            };
        });
    </script>
    <link rel="stylesheet" href="loggedin/style.css">
</head>
<body ng-app="loginApp" ng-controller="loginCtrl">
<nav>
    <div class="logo"><a href="index.html">333<span>Bank</span></a></div>
    <div class="nav-links">
        <a href="index.html">Home</a>
    </div>
    <div class="nav-btns">
        <button class="btn-fill" onclick="location.href='signup.html'">Sign up</button>
    </div>
</nav>
<div class="form-box">
    <h2>Log in to 333Bank</h2>
    <form name="loginForm" >
        <div class="form-group">
            <label>Email address</label>
            <input type="email" name="email" ng-model="email" required>
            <span class="error" ng-show="loginForm.email.$touched && loginForm.email.$error.required">
                Email is required!
            </span>
            <span class="error" ng-show="loginForm.email.$touched && loginForm.email.$error.email">
                Enter a valid email address!
            </span>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" ng-model="password" required ng-minlength="5">
            <span class="error" ng-show="loginForm.password.$touched && loginForm.password.$error.required">
                Password is required!
            </span>
            <span class="error" ng-show="loginForm.password.$touched && loginForm.password.$error.minlength">
                Password must be at least 5 characters!
            </span>
        </div>
        <button type="button" class="btn-fill" ng-click="loginUser()">Log in</button>
    </form>
    <div class="form-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
    </div>
</div>
<footer>© 2026 333Bank. All rights reserved.</footer>
</body>
</html>
